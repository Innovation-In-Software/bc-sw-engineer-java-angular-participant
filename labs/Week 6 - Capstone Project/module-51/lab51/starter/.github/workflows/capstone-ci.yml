# .github/workflows/capstone-ci.yml
name: Capstone CI

on:
  pull_request:
  # TODO: also run on push to main and tags v*
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # TODO: actions/setup-node@v4 with node-version 20 and npm cache on frontend/package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # TODO: npm ci
      # TODO: npx ng build --configuration=production
      - run: echo "TODO: npm ci and ng build"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # TODO: postgres:16 service + SPRING_DATASOURCE_* (db crm)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        # TODO: mvn -B clean verify (never -DskipTests)
        run: echo "TODO: mvn -B clean verify"

